{% extends "base.html" %}
{% block title %}Login - Thailand Weather{% endblock %}
{% block content %}
<div class="card">
    <h2>Login</h2>
    <p style="text-align:center; margin-bottom:1.5rem; opacity:0.7;">Enter your 4-digit ID to check weather</p>
    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="user_id">Your 4-Digit ID</label>
            <input type="text" id="user_id" name="user_id" maxlength="4" pattern="\d{4}"
                   placeholder="e.g. 1234" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <div class="link-text">
        Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
    </div>
</div>
{% endblock %}
