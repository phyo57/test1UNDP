{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card" style="text-align:center;">
    <h2 style="font-size:3rem;">{{ code }}</h2>
    <p style="margin-top:1rem; opacity:0.7;">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn" style="margin-top:1.5rem; display:inline-block; width:auto; padding:0.8rem 2rem;">Go Home</a>
</div>
{% endblock %}
